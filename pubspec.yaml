name: wejoy
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Core
  http: ^1.1.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # UI
  provider: ^6.1.1
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Social login
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4
  sign_in_with_apple: ^5.0.0
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/joya.png
    - assets/images/joyaai.png
    - assets/images/moods/        # ✅ exactly two spaces before hyphen
     